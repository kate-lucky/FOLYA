[package]
name = "folya"
version = "0.1.0"
edition = "2021"

[dependencies]
polars = { version = "0.38", features = ["lazy", "parquet", "csv", "temporal", "rolling_window", "rank"] }
rayon = "1.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
